<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="头痛日记">
<title>头痛日记</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1f2a2e;--sub:#6a777c;--line:#dde3e2;--acc:#3f7f8c;--accink:#fff;--p:hsl(150,45%,50%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2528;--ink:#e6ecec;--sub:#8d9b9f;--line:#2c373a;--acc:#6fb4c2;--accink:#10181a}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1d2528;--ink:#e6ecec;--sub:#8d9b9f;--line:#2c373a;--acc:#6fb4c2;--accink:#10181a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:.02em}
.sub{color:var(--sub);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label.t{display:block;font-weight:600;margin:14px 0 8px}
label.t:first-child{margin-top:0}
.pain{text-align:center}
.num{font-size:64px;font-weight:700;line-height:1;color:var(--p);transition:color .2s}
.desc{color:var(--sub);font-size:14px;margin-top:4px;min-height:21px}
input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--p);height:32px}
.scale{display:flex;justify-content:space-between;color:var(--sub);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
input[type=text],input[type=datetime-local],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:6px}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--sub);font:inherit;font-size:15px;padding:10px;cursor:pointer}
nav button[aria-current=true]{color:var(--acc);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--sub)}
.entry{display:flex;gap:12px}
.badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
.entry h3{margin:0;font-size:16px}.entry small{color:var(--sub)}
.entry p{margin:4px 0 0;font-size:14px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.hide{display:none}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}.bar i{width:84px;flex:none;font-style:normal}.bar .tr{flex:1;height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.bar .tr b{display:block;height:100%;background:var(--acc);border-radius:6px}.bar em{width:64px;text-align:right;color:var(--sub);font-style:normal;flex:none}
.card h2{font-size:17px;margin:0 0 6px}.note{font-size:14px;color:var(--sub);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <h1>头痛日记</h1>
  <p class="sub" id="today"></p>

  <section id="v-new">
    <div class="card pain">
      <label class="t" for="pain">现在有多痛？</label>
      <div class="num" id="num">0</div>
      <div class="desc" id="desc"></div>
      <input type="range" id="pain" min="0" max="10" value="0">
      <div class="scale"><span>0 无痛</span><span>5 中度</span><span>10 剧痛</span></div>
    </div>
    <div class="card">
      <label class="t" for="when">发作时间</label>
      <input type="datetime-local" id="when">
      <label class="t" for="dur">持续时间</label>
      <select id="dur">
        <option value="">还没结束 / 不确定</option>
        <option>1 小时内</option><option>1–4 小时</option><option>4–12 小时</option><option>12–24 小时</option><option>超过 24 小时</option>
      </select>
      <label class="t">疼痛位置</label>
      <div class="chips" data-g="loc"></div>
      <label class="t">伴随症状</label>
      <div class="chips" data-g="sym"></div>
      <label class="t">可能的诱因</label>
      <div class="chips" data-g="trg"></div>
    </div>
    <div class="card">
      <label class="t" for="med">用药（药名和剂量）</label>
      <input type="text" id="med" placeholder="例如：布洛芬 400mg">
      <label class="t">药效如何</label>
      <div class="chips" data-g="eff" data-one="1"></div>
      <label class="t" for="note">备注</label>
      <textarea id="note" placeholder="睡眠、饮食、天气、压力等"></textarea>
    </div>
    <button class="main" id="save">保存记录</button>
  </section>

  <section id="v-hist" class="hide">
    <div class="stats">
      <div class="stat"><b id="s1">0</b><span>本月次数</span></div>
      <div class="stat"><b id="s2">–</b><span>平均疼痛</span></div>
      <div class="stat"><b id="s3">0</b><span>总记录</span></div>
    </div>
    <div id="list"></div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" id="copy">复制全部记录（给医生）</button>
      <button class="ghost" id="clear">清空</button></div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="bk">备份数据（换手机用）</button><button class="ghost" id="rs">恢复数据</button>
    </div>
  </section>
<section id="v-ana" class="hide"></section>
</main>

<nav>
  <button data-v="new" aria-current="true">记录</button>
  <button data-v="hist">历史</button>
  <button data-v="ana">分析</button>
</nav>
<div class="toast" id="toast"></div>

<script>
var OPTS={
 loc:["左侧","右侧","双侧","前额","太阳穴","后脑勺","眼眶后"],
 sym:["恶心","呕吐","畏光","怕吵","先兆（闪光/视野缺损）","头晕","乏力","颈部僵硬"],
 trg:["睡眠不足","压力","天气变化","没吃饭","咖啡因","酒精","特殊食物","月经","强光/屏幕","噪音/气味","运动过度"],
 eff:["很有效","有一点","没效果","没吃药"]
};
var DESC=["无痛","几乎察觉不到","轻微","轻度，能正常活动","中度，有些影响","中度，难以专心","较重，影响生活","重度，需要休息","很严重","极重，无法活动","剧痛，建议及时就医"];
var KEY="migraine-diary-v1",data=[];
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast("无法保存：浏览器禁用了存储");return false}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on")},1800)}
function color(n){return "hsl("+Math.round(150-n*14)+",50%,"+(n>7?45:48)+"%)"}
function pad(n){return n<10?"0"+n:n}
function nowLocal(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function fmt(s){var d=new Date(s);return (d.getMonth()+1)+"月"+d.getDate()+"日 "+pad(d.getHours())+":"+pad(d.getMinutes())}

document.querySelectorAll(".chips").forEach(function(g){
  OPTS[g.dataset.g].forEach(function(o){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=o;b.setAttribute("aria-pressed","false");
    b.onclick=function(){
      if(g.dataset.one)g.querySelectorAll(".chip").forEach(function(c){if(c!==b)c.setAttribute("aria-pressed","false")});
      b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true")};
    g.appendChild(b)})});
function picked(g){return Array.prototype.map.call(document.querySelectorAll('[data-g="'+g+'"] [aria-pressed=true]'),function(c){return c.textContent})}

function setPain(){var v=+$("#pain").value;$("#num").textContent=v;$("#num").style.color=color(v);$("#pain").style.accentColor=color(v);$("#desc").textContent=DESC[v]}
$("#pain").oninput=setPain;

function reset(){$("#pain").value=0;setPain();$("#when").value=nowLocal();$("#dur").value="";$("#med").value="";$("#note").value="";
  document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed","false")})}

$("#save").onclick=function(){
  data.unshift({id:Date.now(),pain:+$("#pain").value,when:$("#when").value||nowLocal(),dur:$("#dur").value,
    loc:picked("loc"),sym:picked("sym"),trg:picked("trg"),eff:picked("eff")[0]||"",med:$("#med").value.trim(),note:$("#note").value.trim()});
  data.sort(function(a,b){return new Date(b.when)-new Date(a.when)});
  if(persist()){toast("已保存");reset()}};

function render(){
  var now=new Date(),m=data.filter(function(e){var d=new Date(e.when);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  $("#s1").textContent=m.length;$("#s3").textContent=data.length;
  $("#s2").textContent=data.length?(data.reduce(function(a,e){return a+e.pain},0)/data.length).toFixed(1):"–";
  var L=$("#list");
  if(!data.length){L.innerHTML='<div class="empty">还没有记录。<br>头痛发作时，在“记录”页写下第一条。</div>';return}
  L.innerHTML=data.map(function(e){
    var tags=[].concat(e.loc,e.sym,e.trg.map(function(t){return "诱因："+t})).join("、");
    var med=e.med?("用药："+e.med+(e.eff?"（"+e.eff+"）":"")):(e.eff?"用药："+e.eff:"");
    return '<div class="card entry"><div class="badge" style="background:'+color(e.pain)+'">'+e.pain+'</div><div style="flex:1;min-width:0">'+
      '<h3>'+fmt(e.when)+(e.dur?' <small>· '+esc(e.dur)+'</small>':'')+'</h3>'+
      (tags?'<p>'+esc(tags)+'</p>':'')+(med?'<p>'+esc(med)+'</p>':'')+(e.note?'<p>'+esc(e.note)+'</p>':'')+
      '</div><button class="ghost" style="align-self:flex-start;padding:4px 10px" data-del="'+e.id+'" aria-label="删除">删除</button></div>'}).join("");
  L.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){
    if(confirm("删除这条记录？")){data=data.filter(function(e){return e.id!=b.dataset.del});persist();render()}}})}

$("#clear").onclick=function(){if(data.length&&confirm("确定清空所有记录？此操作无法恢复。")){data=[];persist();render()}};
$("#copy").onclick=function(){
  var txt="头痛日记\n"+data.map(function(e){return fmt(e.when)+" 疼痛"+e.pain+"/10"+(e.dur?" 持续"+e.dur:"")+
    (e.loc.length?" 位置:"+e.loc.join("/"):"")+(e.sym.length?" 症状:"+e.sym.join("/"):"")+(e.trg.length?" 诱因:"+e.trg.join("/"):"")+
    (e.med?" 用药:"+e.med:"")+(e.eff?"("+e.eff+")":"")+(e.note?" 备注:"+e.note:"")}).join("\n");
  function ok(){toast("已复制，可粘贴到备忘录或微信")}
  try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(e){fallback()}
  function fallback(){var t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("复制失败")}t.remove()}};

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.removeAttribute("aria-current")});b.setAttribute("aria-current","true");
  $("#v-new").classList.toggle("hide",b.dataset.v!=="new");$("#v-hist").classList.toggle("hide",b.dataset.v!=="hist");$("#v-ana").classList.toggle("hide",b.dataset.v!=="ana");
  if(b.dataset.v==="hist")render();if(b.dataset.v==="ana")analyze();window.scrollTo(0,0)}});

var w=["日","一","二","三","四","五","六"],d=new Date();
$("#today").textContent=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 星期"+w[d.getDay()];
function bar(l,n,mx,s){return '<div class="bar"><i>'+esc(l)+'</i><div class="tr"><b style="width:'+Math.round(n/mx*100)+'%"></b></div><em>'+s+'</em></div>'}
function analyze(){
 var A=$("#v-ana");
 if(!data.length){A.innerHTML='<div class="empty">记录几次后，这里会显示发作频率和诱因统计。</div>';return}
 var D=864e5,now=Date.now();
 var d30=data.filter(function(e){return now-new Date(e.when)<=30*D});
 var sd=data.slice().sort(function(a,b){return new Date(a.when)-new Date(b.when)});
 var gap=sd.length>1?((new Date(sd[sd.length-1].when)-new Date(sd[0].when))/D/(sd.length-1)).toFixed(1):"–";
 var severe=d30.filter(function(e){return e.pain>=7}).length;
 var md={};d30.forEach(function(e){if(e.med||(e.eff&&e.eff!=="没吃药"))md[e.when.slice(0,10)]=1});
 var mdn=Object.keys(md).length;
 var c=new Date(),ms=[],i;
 for(i=5;i>=0;i--){var x=new Date(c.getFullYear(),c.getMonth()-i,1);ms.push({k:x.getFullYear()+"-"+x.getMonth(),l:(x.getMonth()+1)+"月",n:0})}
 data.forEach(function(e){var d=new Date(e.when),k=d.getFullYear()+"-"+d.getMonth();ms.forEach(function(m){if(m.k===k)m.n++})});
 var mx=Math.max.apply(null,ms.map(function(m){return m.n}).concat(1));
 var tc={},none=0;
 data.forEach(function(e){if(!e.trg.length)none++;e.trg.forEach(function(t){tc[t]=(tc[t]||0)+1})});
 var tl=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]});
 var h='<div class="stats"><div class="stat"><b>'+d30.length+'</b><span>近30天发作</span></div><div class="stat"><b>'+severe+'</b><span>近30天重度(≥7)</span></div><div class="stat"><b>'+gap+'</b><span>平均间隔(天)</span></div></div>';
 h+='<div class="card"><h2>疼痛频率：近6个月</h2>'+ms.map(function(m){return bar(m.l,m.n,mx,m.n+" 次")}).join("")+'<p class="note">近30天有 '+mdn+' 天用过止痛药。'+(mdn>=10?'已达到10天，止痛药用得较频繁时，可能引起药物过度使用性头痛，建议和医生讨论。':'')+'</p></div>';
 h+='<div class="card"><h2>诱因统计</h2>';
 if(tl.length){h+=tl.map(function(t){return bar(t,tc[t],tc[tl[0]],tc[t]+" 次 "+Math.round(tc[t]/data.length*100)+"%")}).join("")+'<p class="note">百分比 = 出现该诱因的发作次数 ÷ 全部发作。最常见的是“'+esc(tl[0])+'”。'+(none?'另有 '+none+' 次未记录诱因。':'')+'</p>'}
 else h+='<p class="note">记录时勾选“可能的诱因”，这里就会出现统计。</p>';
 h+='</div>';
 A.innerHTML=h}
function copyText(t,msg){function ok(){toast(msg)}function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("复制失败")}a.remove()}try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
$("#bk").onclick=function(){copyText("MIGRAINE-BACKUP:"+JSON.stringify(data),"备份已复制，请粘贴到备忘录保存")};
function doImport(){var t=$("#rsbox").value.trim().replace(/^MIGRAINE-BACKUP:/,"");
 try{var a=JSON.parse(t);if(!Array.isArray(a))throw 0;var ids={},n=0;data.forEach(function(e){ids[e.id]=1});
  a.forEach(function(e){if(e&&typeof e.pain==="number"&&e.when&&!ids[e.id]){data.push({id:e.id||Date.now()+n,pain:e.pain,when:e.when,dur:e.dur||"",loc:e.loc||[],sym:e.sym||[],trg:e.trg||[],eff:e.eff||"",med:e.med||"",note:e.note||""});n++}});
  data.sort(function(a,b){return new Date(b.when)-new Date(a.when)});persist();render();toast("已导入 "+n+" 条记录");$("#rsbox").value=""}
 catch(x){toast("备份文本格式不对")}}
$("#rs").onclick=function(){if($("#rsbox"))return;var b=document.createElement("textarea");b.id="rsbox";b.placeholder="把备份文本粘贴到这里";b.style.marginTop="10px";var g=document.createElement("button");g.className="main";g.textContent="导入";g.onclick=doImport;this.parentNode.after(b,g)};
load();reset();
</script>
</body>
</html>
